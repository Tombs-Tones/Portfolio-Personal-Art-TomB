<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACA Recordings | Thomas Berg</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Manrope Font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #121212; 
            color: #fff;
            min-height: 100vh;
        }
        /* Custom styling to sleek up standard HTML5 audio players in dark mode */
        audio {
            width: 100%;
            height: 40px;
            border-radius: 0.25rem;
            filter: invert(90%) hue-rotate(180deg);
        }
    </style>
</head>
<body>

    <div class="container mx-auto p-4 md:p-8 max-w-3xl">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-12 pb-3 border-b border-gray-700">
            <h1 class="text-2xl font-light text-white tracking-widest uppercase">ACA Recordings</h1>
            <a href="/" class="text-sm text-gray-400 hover:text-amber-300 transition-colors uppercase tracking-wider">← Portfolio</a>
        </header>

        <!-- Loading State -->
        <div id="loading-spinner" class="text-center py-12 text-amber-100">
            <svg class="animate-spin h-8 w-8 text-amber-300 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="mt-3 text-sm text-gray-400">Fetching latest audio tracks...</p>
        </div>
        
        <!-- Audio Playlist Container -->
        <div id="audio-playlist" class="space-y-4">
            <!-- Audio elements will be inserted here dynamically -->
        </div>

        <!-- Error Handling Container -->
        <div id="error-message" class="hidden bg-red-900/50 border border-red-700 p-4 rounded-lg mt-12 text-white">
            <p class="font-bold text-lg mb-1">Unable to Load Tracks</p>
            <p id="error-text" class="text-sm opacity-90"></p>
        </div>
        
    </div>

    <!-- Minimal Footer -->
    <footer class="text-center py-12 mt-16 border-t border-gray-800 text-gray-500 text-xs">
        <p>© <span id="current-year"></span> Thomas Berg. All Rights Reserved.</p>
    </footer>

    <script>
        // === Configuration Details ===
        const username = 'Tombs-Tones'; 
        const repoName = 'Portfolio-Personal-Art-TomB';
        const folderPath = 'ACA'; 
        const branch = 'main'; 
        
        const API_URL = `https://api.github.com/repos/${username}/${repoName}/contents/${folderPath}?ref=${branch}`;
        
        const playlistContainer = document.getElementById('audio-playlist');
        const spinner = document.getElementById('loading-spinner');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');

        document.getElementById('current-year').textContent = new Date().getFullYear();

        // Helper to format clean titles from filenames
        function cleanTrackTitle(filename) {
            let nameWithoutExtension = filename.replace(/\.[^/.]+$/, "");
            return nameWithoutExtension.replace(/[_-]/g, ' ');
        }

        // Convert bytes to a human-readable file size format
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        // Convert raw seconds into a clean minutes:seconds string
        function formatDuration(seconds) {
            if (!seconds || isNaN(seconds)) return '';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        async function fetchAndRenderAudio() {
            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error(`The folder "${folderPath}" was not found.`);
                    } else {
                        throw new Error(`GitHub API Error (${response.status}).`);
                    }
                }

                const files = await response.json();
                
                // Filter specifically for MP3 files and sort alphabetically
                const audioFiles = files
                    .filter(file => file.name.toLowerCase().endsWith('.mp3'))
                    .sort((a, b) => a.name.localeCompare(b.name));
                
                if (audioFiles.length === 0) {
                    playlistContainer.innerHTML = `
                        <p class="text-center text-gray-500 py-12 border border-dashed border-gray-800 rounded-lg">
                            No MP3 recordings found in the <strong>${folderPath}</strong> directory yet.
                        </p>`;
                    return;
                }

                // Render each track card
                audioFiles.forEach((file, index) => {
                    const trackTitle = cleanTrackTitle(file.name);
                    const fileSizeStr = formatFileSize(file.size);
                    const durationId = `duration-${index}`;
                    
                    const trackCard = document.createElement('div');
                    trackCard.className = 'bg-zinc-900/40 border border-zinc-800 p-4 rounded-lg flex flex-col md:flex-row md:items-center justify-between gap-4 transition-all hover:border-zinc-700';
                    
                    trackCard.innerHTML = `
                        <div class="flex-1 min-w-0">
                            <h3 class="text-base font-normal text-zinc-100 truncate tracking-wide">${trackTitle}</h3>
                            <!-- Track Length placeholder -->
                            <p id="${durationId}" class="text-xs text-amber-400/80 mt-0.5 font-medium">Calculating length...</p>
                            <p class="text-xs text-zinc-500 font-mono truncate mt-0.5">${file.name}</p>
                        </div>
                        <div class="w-full md:w-auto flex items-center gap-3">
                            <div class="flex-1 md:w-64">
                                <audio controls src="${file.download_url}" preload="none"></audio>
                            </div>
                            <!-- Updated Download Button reflecting file size -->
                            <a href="${file.download_url}" download="${file.name}" target="_blank" class="bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 text-zinc-200 text-xs px-3 h-10 rounded flex items-center justify-center font-medium transition-colors tracking-wide border border-zinc-700 whitespace-nowrap min-w-[130px]">
                                <svg class="w-4 h-4 mr-1.5 text-zinc-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                </svg>
                                Download (${fileSizeStr})
                            </a>
                        </div>
                    `;
                    
                    playlistContainer.appendChild(trackCard);

                    // Background process to grab audio duration without downloading the whole file
                    const audioHelper = new Audio();
                    audioHelper.src = file.download_url;
                    audioHelper.preload = 'metadata';
                    
                    audioHelper.onloadedmetadata = () => {
                        const durationEl = document.getElementById(durationId);
                        if (durationEl) {
                            durationEl.textContent = `${formatDuration(audioHelper.duration)}`;
                        }
                    };
                    
                    audioHelper.onerror = () => {
                        const durationEl = document.getElementById(durationId);
                        if (durationEl) {
                            durationEl.textContent = 'Audio Track'; // Fallback if metadata blocks
                        }
                    };
                });

            } catch (error) {
                console.error(error);
                errorMessage.classList.remove('hidden');
                errorText.textContent = error.message;
            } finally {
                spinner.classList.add('hidden');
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', fetchAndRenderAudio);
    </script>

</body>
</html>
